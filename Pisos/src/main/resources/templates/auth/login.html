<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión · AlquilaYa</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background:var(--color-bg); display:flex; flex-direction:column; min-height:100vh;">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container-sm" style="flex:1; padding-top:3rem; padding-bottom:3rem;">
  <div class="form-card">
    <h1 class="form-title">Iniciar sesión</h1>

    <div th:if="${errorMsg}"  class="alert alert-danger"  th:text="${errorMsg}"></div>
    <div th:if="${logoutMsg}" class="alert alert-success" th:text="${logoutMsg}"></div>
    <div th:if="${exito}"     class="alert alert-success" th:text="${exito}"></div>

    <form th:action="@{/auth/login}" method="post">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" class="form-control"
               placeholder="tu@email.com" required autofocus/>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="••••••••" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.5rem;">
        Iniciar sesión
      </button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:.875rem; color:var(--color-text-2);">
      ¿No tienes cuenta?
      <a th:href="@{/auth/registro}">Regístrate gratis</a>
    </p>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
