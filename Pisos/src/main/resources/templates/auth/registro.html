<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Registro · AlquilaYa</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background:var(--color-bg); display:flex; flex-direction:column; min-height:100vh;">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container-sm" style="flex:1; padding-top:3rem; padding-bottom:3rem;">
  <div class="form-card">
    <h1 class="form-title">Crear cuenta</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/auth/registro}" method="post">

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" class="form-control"
               placeholder="Ana García" required minlength="2" maxlength="100"/>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="tu@email.com" required/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" class="form-control"
                 placeholder="Mínimo 8 caracteres" required minlength="8"/>
        </div>
        <div class="form-group">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <input type="password" id="confirmarContrasena" name="confirmarContrasena"
                 class="form-control" placeholder="Repite la contraseña" required/>
        </div>
      </div>

      <!-- Tipo de usuario -->
      <div class="form-group">
        <label>Tipo de cuenta</label>
        <div style="display:flex; gap:1rem; margin-top:.5rem;">
          <label style="flex:1; cursor:pointer;">
            <input type="radio" name="tipoUsuario" value="INQUILINO" checked
                   style="accent-color:var(--color-accent); margin-right:.4rem;"/>
            <strong>Inquilino</strong>
            <div class="form-hint">Busco alojamiento para reservar.</div>
          </label>
          <label style="flex:1; cursor:pointer;">
            <input type="radio" name="tipoUsuario" value="PROPIETARIO"
                   style="accent-color:var(--color-accent); margin-right:.4rem;"/>
            <strong>Propietario</strong>
            <div class="form-hint">Quiero publicar mi propiedad.</div>
          </label>
        </div>
      </div>

      <div id="error-pass" class="alert alert-danger" style="display:none;">
        Las contraseñas no coinciden.
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.75rem;">
        Crear cuenta
      </button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:.875rem; color:var(--color-text-2);">
      ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a>
    </p>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const p1 = document.getElementById('contrasena').value;
  const p2 = document.getElementById('confirmarContrasena').value;
  const err = document.getElementById('error-pass');
  if (p1 !== p2) {
    e.preventDefault();
    err.style.display = 'flex';
  } else {
    err.style.display = 'none';
  }
});
</script>
</body>
</html>
