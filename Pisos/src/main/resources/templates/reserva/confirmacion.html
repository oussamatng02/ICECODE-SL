<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reserva confirmada · AlquilaYa</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container-sm">
  <div class="confirm-screen">
    <div class="icon">✅</div>
    <h1>¡Reserva confirmada!</h1>
    <p>
      Tu reserva en <strong th:text="${reserva.inmueble.titulo}"></strong> ha sido confirmada.
      Hemos enviado los detalles a tu email.
    </p>

    <!-- Resumen -->
    <div style="background:var(--color-surface); border:1px solid var(--color-border);
                border-radius:var(--radius-lg); padding:1.5rem; text-align:left; margin:1.5rem auto;
                max-width:420px;">
      <div style="font-size:.75rem; font-weight:700; text-transform:uppercase;
                  letter-spacing:.06em; color:var(--color-text-2); margin-bottom:1rem;">
        Detalles de la reserva
      </div>
      <div style="display:flex; flex-direction:column; gap:.6rem; font-size:.875rem;">
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Referencia</span>
          <span style="font-weight:700;">#<span th:text="${reserva.id}"></span></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Alojamiento</span>
          <span th:text="${reserva.inmueble.titulo}"></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Ubicación</span>
          <span th:text="${reserva.inmueble.ubicacion}"></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Entrada</span>
          <span th:text="${#temporals.format(reserva.fechaEntrada,'dd MMM yyyy')}"></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Salida</span>
          <span th:text="${#temporals.format(reserva.fechaSalida,'dd MMM yyyy')}"></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Noches</span>
          <span th:text="${reserva.numNoches}"></span>
        </div>
        <div style="display:flex; justify-content:space-between; border-top:1px solid var(--color-border);
                    padding-top:.6rem; margin-top:.4rem; font-weight:700; font-size:1rem;">
          <span>Total pagado</span>
          <span>€<span th:text="${#numbers.formatDecimal(reserva.importeTotal,1,2)}"></span></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--color-text-2);">Anfitrión</span>
          <span th:text="${reserva.inmueble.propietario.nombre}"></span>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <a th:href="@{/reservas/mis-reservas}" class="btn btn-primary">Ver mis reservas</a>
      <a th:href="@{/}"                       class="btn btn-outline">Explorar más alojamientos</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
