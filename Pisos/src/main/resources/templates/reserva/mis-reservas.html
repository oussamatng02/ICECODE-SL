<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mis reservas · AlquilaYa</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container" style="padding-top:2rem; padding-bottom:3rem;">
  <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:1.5rem;">📅 Mis reservas</h1>

  <div th:replace="~{fragments/layout :: alertas}"></div>

  <div th:if="${reservas.empty}"
       style="text-align:center; padding:4rem 0; color:var(--color-text-2);">
    <div style="font-size:3rem; margin-bottom:1rem;">🗓️</div>
    <p>Aún no tienes reservas.</p>
    <a th:href="@{/inmuebles/buscar}" class="btn btn-primary" style="margin-top:1rem;">
      Buscar alojamiento
    </a>
  </div>

  <!-- Tarjetas de reserva -->
  <div th:each="res : ${reservas}"
       style="background:var(--color-surface); border:1px solid var(--color-border);
              border-radius:var(--radius-lg); padding:1.25rem 1.5rem; margin-bottom:1rem;
              display:flex; gap:1.5rem; align-items:flex-start; flex-wrap:wrap;">

    <!-- Emoji del tipo -->
    <div style="width:72px; height:72px; border-radius:var(--radius-md);
                background:linear-gradient(135deg,#e0e7ff,#fef3c7);
                display:flex; align-items:center; justify-content:center; font-size:2rem; flex-shrink:0;">
      <span th:switch="${res.inmueble.tipo.name()}">
        <span th:case="'VIVIENDA_COMPLETA'">🏠</span>
        <span th:case="'HABITACION_PRIVADA'">🛏</span>
        <span th:case="*">🏘</span>
      </span>
    </div>

    <!-- Info principal -->
    <div style="flex:1; min-width:200px;">
      <div style="display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:.35rem;">
        <a th:href="@{/inmuebles/{id}(id=${res.inmueble.id})}"
           th:text="${res.inmueble.titulo}"
           style="font-size:1.05rem; font-weight:700;"></a>
        <span th:switch="${res.estado.name()}">
          <span th:case="'CONFIRMADA'"     class="badge badge-green">✓ Confirmada</span>
          <span th:case="'PENDIENTE_PAGO'" class="badge badge-amber">⏳ Pendiente de pago</span>
          <span th:case="'CANCELADA'"      class="badge badge-red">✕ Cancelada</span>
          <span th:case="'COMPLETADA'"     class="badge badge-blue">✓ Completada</span>
        </span>
        <span th:if="${res.tipoFlujo.name()=='INMEDIATA'}" class="badge badge-green" style="font-size:.7rem;">⚡ Inmediata</span>
        <span th:if="${res.tipoFlujo.name()=='SOLICITUD'}"  class="badge badge-amber" style="font-size:.7rem;">📋 Solicitud</span>
      </div>

      <div style="font-size:.875rem; color:var(--color-text-2);">
        📍 <span th:text="${res.inmueble.ubicacion}"></span>
      </div>
      <div style="font-size:.875rem; color:var(--color-text-2); margin-top:.25rem;">
        📅 <span th:text="${#temporals.format(res.fechaEntrada,'dd MMM yyyy')}"></span>
        → <span th:text="${#temporals.format(res.fechaSalida,'dd MMM yyyy')}"></span>
        · <span th:text="${res.numNoches}"></span> noche(s)
      </div>
      <div style="font-size:.875rem; color:var(--color-text-2); margin-top:.25rem;">
        👤 Anfitrión: <span th:text="${res.inmueble.propietario.nombre}"></span>
      </div>
    </div>

    <!-- Precio y acciones -->
    <div style="text-align:right; flex-shrink:0;">
      <div style="font-size:1.2rem; font-weight:700; margin-bottom:.75rem;">
        €<span th:text="${#numbers.formatDecimal(res.importeTotal,1,2)}"></span>
      </div>

      <!-- Ir a pagar si pendiente -->
      <a th:if="${res.estado.name()=='PENDIENTE_PAGO'}"
         th:href="@{/pagos/procesar/{id}(id=${res.id})}"
         class="btn btn-primary btn-sm" style="display:block; margin-bottom:.5rem;">
        Pagar ahora
      </a>

      <!-- Cancelar si activa -->
      <form th:if="${res.estado.name()=='CONFIRMADA' or res.estado.name()=='PENDIENTE_PAGO'}"
            th:action="@{/reservas/{id}/cancelar(id=${res.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-outline btn-sm"
                onclick="return confirm('¿Cancelar esta reserva?')">
          Cancelar
        </button>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
