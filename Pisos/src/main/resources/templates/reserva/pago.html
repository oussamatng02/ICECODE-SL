<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pago · AlquilaYa</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background:var(--color-bg);">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container-sm" style="padding-top:2rem; padding-bottom:3rem;">
  <a th:href="@{/reservas/mis-reservas}"
     style="font-size:.875rem; color:var(--color-text-2); display:inline-block; margin-bottom:1.25rem;">
    ← Volver a mis reservas
  </a>

  <div th:replace="~{fragments/layout :: alertas}"></div>

  <!-- Resumen de la reserva -->
  <div style="background:var(--color-surface); border:1px solid var(--color-border);
              border-radius:var(--radius-lg); padding:1.25rem 1.5rem; margin-bottom:1.5rem;">
    <div style="font-size:.75rem; font-weight:700; text-transform:uppercase;
                letter-spacing:.06em; color:var(--color-text-2); margin-bottom:.75rem;">
      Resumen de la reserva
    </div>
    <div style="font-weight:700; font-size:1.05rem; margin-bottom:.35rem;"
         th:text="${reserva.inmueble.titulo}"></div>
    <div style="font-size:.875rem; color:var(--color-text-2);">
      📍 <span th:text="${reserva.inmueble.ubicacion}"></span>
    </div>
    <div style="font-size:.875rem; color:var(--color-text-2); margin-top:.25rem;">
      📅 <span th:text="${#temporals.format(reserva.fechaEntrada,'dd MMM yyyy')}"></span>
      → <span th:text="${#temporals.format(reserva.fechaSalida,'dd MMM yyyy')}"></span>
      · <span th:text="${reserva.numNoches}"></span> noche(s)
    </div>

    <div style="border-top:1px solid var(--color-border); margin-top:1rem; padding-top:1rem;">
      <div class="price-row">
        <span>€<span th:text="${#numbers.formatDecimal(reserva.inmueble.precioPorNoche,1,0)}"></span>
              × <span th:text="${reserva.numNoches}"></span> noche(s)</span>
        <span>€<span th:text="${#numbers.formatDecimal(reserva.inmueble.precioPorNoche * reserva.numNoches,1,2)}"></span></span>
      </div>
      <div class="price-row">
        <span>Tarifa de servicio</span>
        <span>€<span th:text="${#numbers.formatDecimal(reserva.tarifaServicio,1,2)}"></span></span>
      </div>
      <div class="price-row total">
        <span>Total a pagar</span>
        <span>€<span th:text="${#numbers.formatDecimal(reserva.importeTotal,1,2)}"></span></span>
      </div>
    </div>
  </div>

  <!-- Formulario de pago -->
  <div class="form-card">
    <h1 class="form-title" style="font-size:1.25rem;">Datos de pago</h1>

    <form th:action="@{/pagos/procesar/{id}(id=${reserva.id})}" method="post" id="pay-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <!-- Método de pago -->
      <div class="form-group">
        <label>Método de pago</label>
        <div class="pay-methods">
          <label class="pay-method-card selected" id="lbl-tarjeta-credito">
            <input type="radio" name="metodoPago" value="TARJETA_CREDITO"
                   style="display:none;" checked onchange="switchMethod(this.value)"/>
            <div class="pm-icon">💳</div>
            <div class="pm-label">Tarjeta de crédito</div>
          </label>
          <label class="pay-method-card" id="lbl-tarjeta-debito">
            <input type="radio" name="metodoPago" value="TARJETA_DEBITO"
                   style="display:none;" onchange="switchMethod(this.value)"/>
            <div class="pm-icon">💳</div>
            <div class="pm-label">Tarjeta de débito</div>
          </label>
          <label class="pay-method-card" id="lbl-paypal">
            <input type="radio" name="metodoPago" value="PAYPAL"
                   style="display:none;" onchange="switchMethod(this.value)"/>
            <div class="pm-icon">🅿️</div>
            <div class="pm-label">PayPal</div>
          </label>
        </div>
      </div>

      <!-- Campos tarjeta -->
      <div id="card-fields">
        <div class="form-group">
          <label>Número de tarjeta</label>
          <input type="text" class="form-control" placeholder="1234 5678 9012 3456"
                 maxlength="19" id="card-num" oninput="formatCard(this)"/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Caducidad</label>
            <input type="text" class="form-control" placeholder="MM/AA" maxlength="5"
                   id="card-exp" oninput="formatExp(this)"/>
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input type="text" class="form-control" placeholder="123" maxlength="4"/>
          </div>
        </div>
        <div class="form-group">
          <label>Nombre en la tarjeta</label>
          <input type="text" class="form-control" placeholder="ANA GARCIA"/>
        </div>
      </div>

      <!-- Campos PayPal -->
      <div id="paypal-fields" style="display:none;">
        <div class="form-group">
          <label>Email de PayPal</label>
          <input type="email" class="form-control" placeholder="tu@email.com"/>
        </div>
        <div class="alert alert-info" style="font-size:.8rem; margin-top:.5rem;">
          Serás redirigido a PayPal para completar el pago de forma segura.
        </div>
      </div>

      <div class="alert alert-info" style="font-size:.8rem;">
        🔒 Pago simulado — los datos no se procesan en ninguna pasarela real.
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem;">
        🔒 Confirmar pago · €<span th:text="${#numbers.formatDecimal(reserva.importeTotal,1,2)}"></span>
      </button>
    </form>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
const methodMap = {
  'TARJETA_CREDITO': 'lbl-tarjeta-credito',
  'TARJETA_DEBITO':  'lbl-tarjeta-debito',
  'PAYPAL':          'lbl-paypal'
};

function switchMethod(val) {
  // Estilos
  Object.values(methodMap).forEach(id => {
    document.getElementById(id).classList.remove('selected');
  });
  document.getElementById(methodMap[val]).classList.add('selected');
  // Campos
  const isPaypal = val === 'PAYPAL';
  document.getElementById('card-fields').style.display   = isPaypal ? 'none' : '';
  document.getElementById('paypal-fields').style.display = isPaypal ? '' : 'none';
}

function formatCard(input) {
  let v = input.value.replace(/\D/g, '').substring(0, 16);
  input.value = v.replace(/(.{4})/g, '$1 ').trim();
}

function formatExp(input) {
  let v = input.value.replace(/\D/g, '').substring(0, 4);
  if (v.length > 2) v = v.substring(0,2) + '/' + v.substring(2);
  input.value = v;
}
</script>
</body>
</html>
